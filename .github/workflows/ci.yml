name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  tests:
    name: Debug tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean-checkout configuration
        run: |
          test -f Config.xcconfig
          test -f Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          plutil -lint Pinly/Info.plist Pinly/PrivacyInfo.xcprivacy Pinly.xcodeproj/project.pbxproj
          scripts/security_sweep.sh

      - name: Select Xcode 26.6
        run: |
          test -d "$XCODE_DEVELOPER_DIR"
          sudo xcode-select --switch "$XCODE_DEVELOPER_DIR"

      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Select and boot the iPhone simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '
            /^-- iOS 26\.5 --/ { in_runtime = 1; next }
            /^-- / { in_runtime = 0 }
            in_runtime && /iPhone 17 Pro \(/ { print $2; exit }
          ')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "Required iPhone 17 Pro / iOS 26.5 simulator is not available on this runner image" >&2
            exit 1
          fi
          echo "Selected iPhone 17 Pro / iOS 26.5 simulator: $SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Pinly/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-${{ hashFiles('Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly" \
            -disableAutomaticPackageResolution 2>&1 | tee spm-resolve.log

      - name: Build Debug tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly" \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage YES 2>&1 | tee debug-build.log

      - name: Run PinlyTests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -only-testing:PinlyTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult 2>&1 | tee tests.log

      - name: Upload Debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-test-evidence
          path: |
            TestResults.xcresult
            spm-resolve.log
            debug-build.log
            tests.log
          if-no-files-found: ignore
          retention-days: 7

  release-compile:
    name: Release compile
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean-checkout configuration
        run: |
          test -f Config.xcconfig
          test -f Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          plutil -lint Pinly/Info.plist Pinly/PrivacyInfo.xcprivacy Pinly.xcodeproj/project.pbxproj
          scripts/security_sweep.sh

      - name: Select Xcode 26.6
        run: |
          test -d "$XCODE_DEVELOPER_DIR"
          sudo xcode-select --switch "$XCODE_DEVELOPER_DIR"

      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Pinly-Release/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-release-${{ hashFiles('Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-release-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly-Release" \
            -disableAutomaticPackageResolution 2>&1 | tee release-spm-resolve.log

      - name: Compile Release configuration
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly-Release" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee release-build.log

      - name: Upload Release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compile-evidence
          path: |
            release-spm-resolve.log
            release-build.log
          if-no-files-found: ignore
          retention-days: 7
