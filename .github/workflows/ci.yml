name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Debug tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Select an available iPhone simulator
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16 Pro \(/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          fi
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Pinly/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Run tests
        run: |
          xcodebuild test \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly" \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  release-compile:
    name: Release compile
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Pinly-Release/SourcePackages
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-release-

      - name: Compile Release configuration
        run: |
          xcodebuild build \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly-Release" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO
