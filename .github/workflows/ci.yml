name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Debug tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean-checkout configuration
        run: |
          test -f Config.xcconfig
          test -f Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          plutil -lint Pinly/Info.plist Pinly/PrivacyInfo.xcprivacy Pinly.xcodeproj/project.pbxproj
          scripts/security_sweep.sh

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Select an available iPhone simulator
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16 Pro \(/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          fi
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Pinly/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly" \
            -disableAutomaticPackageResolution 2>&1 | tee spm-resolve.log

      - name: Build Debug tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly" \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage YES 2>&1 | tee debug-build.log

      - name: Run PinlyTests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -only-testing:PinlyTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult 2>&1 | tee tests.log

      - name: Upload Debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-test-evidence
          path: |
            TestResults.xcresult
            spm-resolve.log
            debug-build.log
            tests.log
          if-no-files-found: ignore
          retention-days: 7

  release-compile:
    name: Release compile
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean-checkout configuration
        run: |
          test -f Config.xcconfig
          test -f Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          plutil -lint Pinly/Info.plist Pinly/PrivacyInfo.xcprivacy Pinly.xcodeproj/project.pbxproj
          scripts/security_sweep.sh

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Pinly-Release/SourcePackages
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Pinly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-release-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly-Release" \
            -disableAutomaticPackageResolution 2>&1 | tee release-spm-resolve.log

      - name: Compile Release configuration
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pinly.xcodeproj \
            -scheme Pinly \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/Pinly-Release" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee release-build.log

      - name: Upload Release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compile-evidence
          path: |
            release-spm-resolve.log
            release-build.log
          if-no-files-found: ignore
          retention-days: 7
